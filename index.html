<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Text Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for the app */
        :root {
            --bg-light: #f3f4f6;
            --text-light: #111827;
            --card-bg-light: #ffffff;
            --border-light: #e5e7eb;
            --primary-light: #3b82f6;
            --primary-hover-light: #2563eb;
            
            --bg-dark: #111827;
            --text-dark: #f9fafb;
            --card-bg-dark: #1f2937;
            --border-dark: #374151;
            --primary-dark: #60a5fa;
            --primary-hover-dark: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s, color 0.5s;
        }

        /* Light theme variables */
        body:not(.dark) {
            --bg-color: var(--bg-light);
            --text-color: var(--text-light);
            --card-bg-color: var(--card-bg-light);
            --border-color: var(--border-light);
            --primary-color: var(--primary-light);
            --primary-hover-color: var(--primary-hover-light);
        }

        /* Dark theme variables */
        body.dark {
            --bg-color: var(--bg-dark);
            --text-color: var(--text-dark);
            --card-bg-color: var(--card-bg-dark);
            --border-color: var(--border-dark);
            --primary-color: var(--primary-dark);
            --primary-hover-color: var(--primary-hover-dark);
        }

        /* Applying theme colors */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        
        .card {
            background-color: var(--card-bg-color);
            border-color: var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.5s;
        }
        
        .card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .theme-btn {
             background-color: var(--card-bg-color);
             color: var(--text-color);
        }

        .copy-btn {
            background-color: var(--primary-color);
            color: white;
        }
        .copy-btn:hover {
            background-color: var(--primary-hover-color);
        }
        
        .main-textarea {
            background-color: var(--card-bg-color);
            border-color: var(--border-color);
            color: var(--text-color);
        }
        
        .main-textarea:focus {
             --tw-ring-color: var(--primary-color);
        }
        
        /* Sparkle effect */
        .sparkle {
            position: fixed;
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: sparkle-anim 0.8s forwards;
            opacity: 0.7;
        }

        @keyframes sparkle-anim {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: scale(0) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background-color: var(--primary-color);
            border-radius: 10px;
            border: 2px solid var(--bg-color);
        }
    </style>
</head>
<body class="overflow-x-hidden">

    <div id="sparkle-container"></div>

    <div class="container mx-auto px-4 py-8 relative z-10">
        
        <header class="text-center mb-8 relative">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-2">
                Stylish Text Generator
            </h1>
            <p class="text-lg md:text-xl opacity-70">
                Create fancy fonts with Unicode symbols
            </p>
            <button id="theme-switcher" class="theme-btn absolute top-0 right-0 w-12 h-12 rounded-full shadow-md flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[var(--bg-color)] focus:ring-[var(--primary-color)] transition-all duration-300">
                <i class="fas fa-moon text-xl"></i>
            </button>
        </header>

        <main>
            <div class="mb-8">
                <textarea id="text-input" class="main-textarea w-full p-4 border-2 rounded-xl shadow-inner text-lg focus:outline-none focus:ring-2 transition-all duration-300" rows="4" placeholder="Type or paste your text here..."></textarea>
            </div>

            <div id="output-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Stylish text cards will be generated here -->
                <div class="card border rounded-xl p-4 flex flex-col items-center justify-center min-h-[150px] opacity-50">
                    <p class="text-lg text-center">Your stylish text will appear here!</p>
                </div>
            </div>
        </main>
        
        <!-- Copy notification toast -->
        <div id="toast" class="fixed bottom-10 right-10 bg-green-500 text-white py-2 px-5 rounded-lg shadow-xl translate-y-20 opacity-0 transition-all duration-300">
            Copied to clipboard!
        </div>

    </div>

            function convertText(text, font) {
                // Handles complex decorator functions
                if (font.name === 'Vaporwave') {
                    const wideMap = { 'a': 'ａ', 'b': 'ｂ', 'c': 'ｃ', 'd': 'ｄ', 'e': 'ｅ', 'f': 'ｆ', 'g': 'ｇ', 'h': 'ｈ', 'i': 'ｉ', 'j': 'ｊ', 'k': 'ｋ', 'l': 'ｌ', 'm': 'ｍ', 'n': 'ｎ', 'o': 'ｏ', 'p': 'ｐ', 'q': 'ｑ', 'r': 'ｒ', 's': 'ｓ', 't': 'ｔ', 'u': 'ｕ', 'v': 'ｖ', 'w': 'ｗ', 'x': 'ｘ', 'y': 'ｙ', 'z': 'ｚ', 'A': 'Ａ', 'B': 'Ｂ', 'C': 'Ｃ', 'D': 'Ｄ', 'E': 'Ｅ', 'F': 'Ｆ', 'G': 'Ｇ', 'H': 'Ｈ', 'I': 'Ｉ', 'J': 'Ｊ', 'K': 'Ｋ', 'L': 'Ｌ', 'M': 'Ｍ', 'N': 'Ｎ', 'O': 'Ｏ', 'P': 'Ｐ', 'Q': 'Ｑ', 'R': 'Ｒ', 'S': 'Ｓ', 'T': 'Ｔ', 'U': 'Ｕ', 'V': 'Ｖ', 'W': 'Ｗ', 'X': 'Ｘ', 'Y': 'Ｙ', 'Z': 'Ｚ' };
                    let converted = '';
                    for (const char of text) {
                        converted += wideMap[char] || char;
                    }
                    return converted.split('').join(' ');
                }
                 if (font.name === 'Matrix' || font.name === 'Glitch') {
                    const chars = '̴̷̸̡̢̧̨̛̜̝̟̠̣̤̥̦̩̪̫̬̭̮	';
                    let result = '';
                    for (const char of text) {
                        result += char;
                        for(let i = 0; i < 5; i++) {
                           result += chars[Math.floor(Math.random() * chars.length)];
                        }
                    }
                    return result;
                }

                // Handles styles like strikethrough that add a character after each letter
                if (font.type === 'combiner') {
                    let result = '';
                    for (const char of text) {
                        if (char.trim() === '') {
                            result += char;
                        } else {
                            result += char + font.combiner;
                        }
                    }
                    return result;
                }

                // Handles styles that add prefixes, suffixes, or joiners
                if (font.type === 'decorator') {
                    const prefix = font.prefix || '';
                    const suffix = font.suffix || '';
                    const joiner = font.joiner === undefined ? ' ' : font.joiner;
                    return text.split('').map(char => {
                        if (char.trim() === '') return char;
                        return prefix + char + suffix;
                    }).join(joiner);
                }

                // Handles styles that map characters to new ones
                const map = font.map || {};
                let converted = '';
                for (const char of text) {
                    converted += map[char] || map[char.toLowerCase()] || map[char.toUpperCase()] || char;
                }
                
                // Special case for the Flipped font which also needs to be reversed
                 if (font.name === 'Flipped') {
                    return converted.split('').reverse().join('');
                }
                return converted;
            }

            function showToast() {
                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 2000);
            }

            function copyToClipboard(text) {
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = text;
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                document.body.removeChild(tempTextarea);
            }

            function updateOutput() {
                const inputText = textInput.value;
                outputContainer.innerHTML = '';

                if (inputText.trim() === '') {
                    outputContainer.innerHTML = `
                        <div class="card border rounded-xl p-4 flex flex-col items-center justify-center min-h-[150px] opacity-50 sm:col-span-2 lg:col-span-3">
                            <p class="text-lg text-center">Your stylish text will appear here!</p>
                        </div>`;
                    return;
                }

                fontMaps.forEach(font => {
                    const convertedText = convertText(inputText, font);
                    
                    const card = document.createElement('div');
                    card.className = 'card border rounded-xl p-4 flex flex-col justify-between shadow-lg';
                    
                    const textDisplay = document.createElement('p');
                    textDisplay.className = 'text-2xl mb-4 break-words flex-grow';
                    textDisplay.textContent = convertedText;

                    const cardFooter = document.createElement('div');
                    cardFooter.className = 'flex items-center justify-between';

                    const fontName = document.createElement('span');
                    fontName.className = 'text-sm font-semibold opacity-70';
                    fontName.textContent = font.name;

                    const copyButton = document.createElement('button');
                    copyButton.className = 'copy-btn text-sm font-bold py-2 px-4 rounded-lg transition-transform duration-200 ease-in-out hover:scale-105';
                    copyButton.textContent = 'Copy';
                    copyButton.onclick = () => copyToClipboard(convertedText);

                    cardFooter.appendChild(fontName);
                    cardFooter.appendChild(copyButton);
                    card.appendChild(textDisplay);
                    card.appendChild(cardFooter);
                    outputContainer.appendChild(card);
                });
            }

            // --- Initial Setup ---
            textInput.addEventListener('input', updateOutput);
            applyTheme();
            updateOutput();
